services:
  dind:
    image: docker:dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    volumes:
      - dind-storage:/var/lib/docker
    networks:
      - claude-net
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  claude:
    build:
      context: .
      dockerfile: Dockerfile.claude
    image: claude-code:latest
    privileged: true
    environment:
      - DOCKER_HOST=tcp://dind:2375
    volumes:
      - ${CLAUDE_PROJECTS_PATH:-./projects}:/workspace
      - ${CLAUDE_CONFIG_PATH:-./config}:/root/.claude
    depends_on:
      dind:
        condition: service_healthy
    networks:
      - claude-net
    stdin_open: true
    tty: true

  ttyd:
    image: tsl0922/ttyd:alpine
    container_name: claude-web
    command: ["ttyd", "-W", "-p", "7681", "-t", "fontSize=14", "-c", "${TTYD_USERNAME:-admin}:${TTYD_PASSWORD:-changeme}", "/usr/local/bin/docker", "exec", "-it", "claude-dind-claude-1", "claude"]
    ports:
      - "${TTYD_PORT:-7681}:7681"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/local/bin/docker:/usr/local/bin/docker:ro
    depends_on:
      - claude
    networks:
      - claude-net
    restart: unless-stopped

volumes:
  dind-storage:

networks:
  claude-net:
    driver: bridge
